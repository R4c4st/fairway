<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fairway — golf entre potes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#1b7a3d;--gd:#14532d;--gl:#e7f4ec;--bg:#f6f7f5;--card:#fff;--tx:#14201a;--mu:#68756d;--bd:#dde3de;--red:#d9363e;--blue:#2563c9;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--g)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--gd);color:#fff}
.top h1{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{color:#fff;text-decoration:none;font-size:32px;line-height:1;padding:0 6px}
.top .logo{width:30px;height:30px;border-radius:8px}
.icon{background:none;border:0;font-size:20px;padding:4px 6px;cursor:pointer}
.top .icon{filter:grayscale(.2)}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff22;white-space:nowrap}
.sync.ok{background:#22c55e33}.sync.warn{background:#f59e0b55}.sync.off{background:#ffffff1f}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:22px 0 8px}
small{display:block;color:var(--mu);font-size:13px}
.muted{color:var(--mu)}.err{color:var(--red);font-weight:600}
.hint{color:var(--mu);font-size:13.5px;margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--g);color:#fff;font:600 16px system-ui;padding:12px 16px;text-decoration:none;cursor:pointer;min-height:46px}
.btn:disabled{opacity:.35}
.btn.ghost{background:var(--card);color:var(--gd);border:1.5px solid var(--bd)}
.btn.big{font-size:17px;min-height:56px}.btn.sm{min-height:38px;padding:8px 12px;font-size:14px}.btn.full{width:100%;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:20px 0}
.row3 .btn{font-size:14px;padding:10px 6px}
.hello,.card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card{display:block}
.gcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:8px 0;color:inherit;text-decoration:none}
.gscore{font-weight:800;font-size:18px;text-align:right;white-space:nowrap}
.form label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin:8px 0}
input,select{width:100%;font:16px system-ui;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);margin-top:4px}
.prow{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;margin:6px 0}
.prow input{margin:0}.me{font-size:12px;color:var(--mu);text-align:center}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer}
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:15;display:flex;background:var(--gd);padding:0 6px 6px;gap:4px}
.tabs button{flex:1;border:0;border-radius:10px;background:transparent;color:#cfe8d6;font:600 14px system-ui;padding:9px 4px}
.tabs button.on{background:#fff;color:var(--gd)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;font:700 15px system-ui;color:var(--tx)}
.chips button.done{background:var(--gl);border-color:#a7d7b6}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.holehead{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.holehead>div:nth-child(2){flex:1;font-size:17px}
.hn{flex:0 0 52px;height:52px;border-radius:14px;background:var(--gd);color:#fff;font:800 26px system-ui;display:flex;align-items:center;justify-content:center}
.stars{color:#e0a100;letter-spacing:1px}
.gps{background:var(--gd);color:#fff;border-radius:var(--r);padding:12px;margin:10px 0}
.gps small{color:#b9dcc5}
.gpsmsg{padding:6px 0 4px}
.gps .btn.ghost{background:#ffffff1a;color:#fff;border-color:#ffffff40}
.dist{display:grid;grid-template-columns:1fr 1.4fr 1fr;text-align:center;align-items:end}
.dist b{font-size:28px;font-weight:800}.dist .mid b{font-size:52px;line-height:1}
.club{text-align:center;margin-top:6px;font-weight:700;color:#d9f99d}
.club small{display:inline}
.measure{display:flex;align-items:center;gap:10px;margin-top:10px;border-top:1px solid #ffffff22;padding-top:10px}
.measure .acc{margin-left:auto}
.players{display:grid;gap:10px}
.player{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.pname b{font-size:17px}.tag{font-size:11px;background:var(--gl);color:var(--gd);padding:1px 6px;border-radius:99px;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:52px;height:52px;border-radius:14px;border:0;background:var(--gl);color:var(--gd);font:700 28px system-ui}
.val{min-width:46px;text-align:center;font:800 30px system-ui}
.val.birdie,.val.eagle{color:var(--red)}.val.par{color:var(--tx)}.val.bogey{color:var(--blue)}.val.dbl{color:#6b21a8}.val.pick{color:var(--mu)}
.sub{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mu)}
.sub button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font:700 18px system-ui;color:var(--tx)}
.sub .pv{min-width:20px;text-align:center;font-weight:700;color:var(--tx)}
.sub .pickbtn{margin-left:8px;width:auto;padding:0 10px}.sub .pickbtn.on{background:var(--tx);color:#fff}
.sub .res{margin-left:auto;font-weight:700;color:var(--gd)}
.holenav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.board{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;margin-top:10px}
.board th,.board td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--bd);font-size:15px}
.board td:nth-child(2){text-align:left;font-weight:700}
.board th{font-size:12px;color:var(--mu);text-transform:uppercase}
.board .meRow{background:var(--gl)}
.duel{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--g);border-radius:var(--r);padding:12px;margin:8px 0;font-size:17px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scard{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
.scard th,.scard td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd)}
.scard th{background:var(--gd);color:#fff;font-size:13px;position:sticky;top:0}
.scard .h{font-weight:800}.scard .si{color:var(--mu);font-size:12px}
.scard .tot{background:var(--gl);font-weight:700}
.scard sub{font-size:10px;color:var(--mu);margin-left:1px}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;font-weight:700}
.sc.birdie{border:2px solid var(--red);border-radius:50%;color:var(--red)}
.sc.eagle{border:4px double var(--red);border-radius:50%;color:var(--red)}
.sc.bogey{border:2px solid var(--blue);color:var(--blue)}
.sc.dbl{border:4px double #6b21a8;color:#6b21a8}
.sc.pick{color:var(--mu)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mu);margin-top:12px}
.legend .sc{transform:scale(.8)}
#map{height:62vh;min-height:360px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd)}
.maptools{display:flex;gap:6px;overflow-x:auto;margin-bottom:4px}
.maptools button{flex:1 0 auto;border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:8px 10px;font:600 13px system-ui}
.maptools button.on{background:#ffd400;border-color:#e0b800}
.mapinfo{display:flex;flex-direction:column;gap:4px;background:var(--gd);color:#fff;border-radius:var(--r);padding:10px 12px;margin-top:8px;font-size:15px}
.mapinfo:empty{display:none}
.mapinfo b{font-size:20px;color:#d9f99d}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
.sheet h2{margin-top:0}
.code{font:800 34px ui-monospace,monospace;letter-spacing:.18em;text-align:center;color:var(--gd)}
.qr{width:200px;margin:8px auto}.qr svg{width:100%;height:auto}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 8px;text-align:center}
.kpis b{font-size:24px;font-weight:800;color:var(--gd)}
.spark{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--g);min-width:2px}
.bar i.birdie{background:var(--red)}.bar i.bogey{background:var(--blue)}.bar i.dbl{background:#6b21a8}.bar i.pick{background:#9ca3af}
.bar b{text-align:right}
.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px}
table.edit{width:100%;border-collapse:collapse}
table.edit th{font-size:11px;color:var(--mu);text-align:left;padding:2px}
table.edit td{padding:2px}
table.edit input{padding:8px 6px;margin:0;font-size:15px;min-width:52px}
table.edit .noterow input{font-size:13px;margin-bottom:8px}
.filebtn{position:relative}
.leaflet-container{font:14px system-ui}
.switch{display:flex!important;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;color:var(--tx)!important;font-size:16px!important}
.switch input{width:22px;height:22px;margin:2px 0 0;flex:0 0 22px;accent-color:var(--g)}
.switch small{font-weight:400}
.btn.danger{color:var(--red);border-color:#f3c4c6;margin-top:14px}
.beta{font-size:11px;font-weight:500;opacity:.75;margin-left:6px;letter-spacing:.02em}
.beta.w{margin:0 0 10px;color:var(--mu);font-size:12px;opacity:1}
.btn.live{background:linear-gradient(135deg,#d9363e,#ff7a45);margin:0 0 6px}
.btn.live span{font-weight:500;font-size:14px;opacity:.9}
.specbadge{font-size:12px;background:#ffffff26;padding:4px 8px;border-radius:99px;white-space:nowrap}
.livecard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-left:5px solid #d9363e;border-radius:var(--r);padding:12px 14px;margin:10px 0;font:inherit;color:inherit}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.livedot{color:#d9363e;font-size:12px;font-weight:800;animation:blink 1.4s infinite}
.livecard ol{margin:8px 0 0;padding-left:20px}
.livecard li{padding:2px 0}.livecard li span{display:inline-block;min-width:60%}
.lc-ev{margin-top:8px;background:#fff7e0;border-radius:10px;padding:6px 10px;font-size:14px}
.where .wrow{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:6px 0;border-top:1px solid var(--bd)}
.where .wrow small{grid-column:1/-1}
.where .wrow:first-of-type{margin-top:6px}
.empty{text-align:center;padding:40px 10px;font-size:40px}.empty p{font-size:17px;font-weight:700;margin:10px 0 4px}
@keyframes blink{50%{opacity:.35}}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #22c55e33,0 0 8px #22c55e;margin-right:6px;vertical-align:middle;animation:ledpulse 2s ease-in-out infinite}
.led.sm{display:none;width:8px;height:8px}
.isonline .led.sm{display:inline-block}
.onl{display:flex;flex-wrap:wrap;gap:8px}
.onchip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:0 4px;background:var(--card);border:1px solid #bfe8cd;border-radius:99px;padding:7px 12px;font-weight:600}
.onchip small{display:inline;margin-left:4px;color:var(--gd);font-weight:500}
h2 .cnt{background:#22c55e;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:4px;vertical-align:middle}
@keyframes ledpulse{50%{box-shadow:0 0 0 4px #22c55e22,0 0 14px #22c55e}}
.cplist{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.cplist li{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.cpd{text-align:right}
.tdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px #fff}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:10px;font:600 15px system-ui}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.teamcard{border:2px solid;border-radius:12px;padding:8px 10px;margin:8px 0;background:#fff}
.tchead{display:flex;align-items:center;gap:6px}.tchead input{margin:0;padding:6px 8px;font-weight:700;border-color:transparent;background:var(--bg)}
.tcount{font-size:13px;color:var(--mu);white-space:nowrap}
.tmem{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tchip{background:var(--gl);border-radius:99px;padding:4px 10px;font-weight:600;font-size:14px}
.assign{display:grid;gap:4px;margin-top:6px}.arow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick.mini{margin:0}.pick.mini button{padding:6px 12px;min-width:40px}
.pick.mini button.on{color:#fff}
.phasebar{background:var(--gl);border-radius:12px;padding:10px 12px;margin:0 0 10px}.phasebar small{display:block}
.chips button.phase{box-shadow:-6px 0 0 -3px #f2a900}
.pname .mem{color:var(--gd);font-weight:600}
.rmem{flex-wrap:wrap}
.combo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--gd);color:#fff;border-radius:var(--r);padding:14px;margin:10px 0}
.combo small{color:#cfe8d6}.cteam.r{text-align:right}.cscore{font:900 34px system-ui;color:#ffd75e;white-space:nowrap}
.gcard.pote{border-left:5px solid #ff9f1c}
/* --- fun --- */
.shotbtn{background:linear-gradient(135deg,#ff9f1c,#ff4d6d);margin:0 0 10px}
.sub .rougebtn{margin-left:4px;font-size:13px}
.sub .rougebtn.on{background:#f2a900;color:#3b2500;border-color:#f2a900}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pick button{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:9px 14px;font:600 15px system-ui;color:var(--tx)}
.pick button.on{background:var(--g);color:#fff;border-color:var(--g)}
.pick.shots button{display:flex;align-items:center;gap:6px;border-radius:12px}
.pick.shots span{font-size:20px}
.code.small{font-size:26px}
.paylist,.feed{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.paylist li{background:#fff7e0;border:1px solid #f2d27a;border-radius:12px;padding:10px 12px}
.feed li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.feed li>span{font-size:26px}
.welcome{text-align:center;padding-top:calc(env(safe-area-inset-top) + 40px)}
.welcome .form{text-align:left;margin-top:20px}
.wlogo{width:110px;height:110px;border-radius:26px;box-shadow:0 8px 24px #14532d44;animation:bounce 1.6s ease-in-out infinite}
.welcome h1{margin:6px 0;font-size:34px;color:var(--gd)}
.pop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:#0007;animation:fade .25s}
.pop.out,.beer.out{opacity:0;transition:opacity .3s}
.popcard{position:relative;background:#fff;border-radius:24px;padding:24px 22px;width:min(88vw,380px);text-align:center;box-shadow:0 20px 60px #0006;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.pop.rouge .popcard{background:#fff7e0}
.popemoji{font-size:84px;line-height:1;animation:wiggle .9s ease-in-out .4s 2;text-align:center}
.poptitle{font:900 26px/1.15 system-ui;margin:10px 0 6px;color:var(--gd)}
.pop.rouge .poptitle{color:#9a5b00}
.popsub{font-size:15px;color:var(--mu);margin-bottom:6px}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s linear forwards}
.beer{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 30%,#2b1a00,#0d0700);display:flex;align-items:center;justify-content:center;animation:fade .3s;overflow:auto}
.beerin{text-align:center;color:#fff;padding:24px;max-width:440px}
.glass{width:180px;height:auto;filter:drop-shadow(0 10px 30px #f2a90055);animation:clink 1s ease-in-out 3.4s 2}
.liquid{transform:translateY(200px);animation:pour 2.8s cubic-bezier(.3,.7,.3,1) .3s forwards}
.foam{fill:#fffaf0;transform:translateY(200px);animation:pour 2.8s cubic-bezier(.3,.7,.3,1) .3s forwards}
.bubbles circle{opacity:0;animation:bubble 2s linear infinite}
.beertitle{font:900 38px/1.1 system-ui;margin:14px 0 6px;color:#ffd75e;opacity:0;animation:rise .6s ease-out 2.6s forwards;text-shadow:0 3px 18px #f2a90088}
.beersub{font-size:17px;color:#f5deb3;opacity:0;animation:rise .6s ease-out 2.9s forwards}
.beerlist{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;text-align:left;opacity:0;animation:rise .6s ease-out 3.2s forwards}
.beerlist li{background:#ffffff14;border-radius:12px;padding:10px 12px;color:#fde9b8}
.beer .btn{margin-top:14px;background:#f2a900;color:#2b1a00;opacity:0;animation:rise .5s ease-out 3.4s forwards}
@keyframes pour{to{transform:translateY(0)}}
@keyframes bubble{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-150px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes clink{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
@keyframes fade{from{opacity:0}}
@keyframes popin{from{transform:scale(.3);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) scale(1.15)}75%{transform:rotate(15deg) scale(1.15)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="courses.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
